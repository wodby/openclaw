name: Build docker image

on:
  pull_request:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  OPENCLAW2026: '2026.10.6'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      openclaw-versions: ${{ steps.set-matrix.outputs.openclaw-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "openclaw2026", "version": "${{ env.OPENCLAW2026 }}", "latest": "1", "latest_major": "1"}
          ]
          EOF
          echo "openclaw-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      matrix:
        openclaw: ${{ fromJson(needs.setup.outputs.openclaw-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        id: brotli-image
        env:
          OPENCLAW_VER: ${{ matrix.openclaw.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Verify Brotli security fixes
        uses: wodby/images/.github/actions/check-brotli@4d79323d1d62295e425a222e8cb23ccf843cbbea
        with:
          image: ${{ steps.brotli-image.outputs.image }}
          check-node: 'true'
          check-bun: 'true'
      - name: Push verified architecture image
        if: github.event_name == 'push'
        env:
          OPENCLAW_VER: ${{ matrix.openclaw.version }}
          ARCH: ${{ matrix.arch }}
        run: make push
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        openclaw: ${{ fromJson(needs.setup.outputs.openclaw-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.openclaw.version }}
          latest: ${{ matrix.openclaw.latest }}
          latest_major: ${{ matrix.openclaw.latest_major }}
  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
